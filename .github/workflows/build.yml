name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir el proyecto
      run: unzip -o AtticPad_Pro_Edition_UI_UX.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar CMake en el SDK de Android
      run: |
        # Aceptar licencias e instalar CMake (versión 3.22.1 es la estándar y estable)
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" > /dev/null || true

    - name: Buscar proyecto y compilar con Gradle
      run: |
        # 1. Buscar la carpeta donde está el build.gradle.kts
        PROJECT_DIR=$(find . -name "build.gradle.kts" | head -n 1 | xargs dirname)
        echo "La carpeta del proyecto es: $PROJECT_DIR"
        
        # 2. Entrar a la carpeta
        cd "$PROJECT_DIR"
        
        # 3. Forzar a Gradle a usar la versión de CMake instalada
        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties
        
        # 4. Compilar
        gradle assembleDebug
        
        # 5. Copiar el APK generado a la raíz
        cp app/build/outputs/apk/debug/app-debug.apk ../../app-debug.apk

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: AtticPad-APK
        path: app-debug.apk
