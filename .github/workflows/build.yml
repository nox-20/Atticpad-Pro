name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir el proyecto
      run: unzip -o AtticPad_Pro_Edition_UI_UX.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar APK
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1 | xargs dirname)
        echo "Carpeta del proyecto encontrada en: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Damos permisos al gradlew y compilamos
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Movemos el APK a la raíz para que sea fácil de encontrar
        cp app/build/outputs/apk/debug/app-debug.apk ../../app-debug.apk

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: AtticPad-APK
        path: app-debug.apk
