name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir el proyecto
      run: unzip -o AtticPad_Pro_Edition_UI_UX.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Buscar proyecto y compilar con Gradle del sistema
      run: |
        # 1. Buscar la carpeta donde está el build.gradle
        PROJECT_DIR=$(find . -name "build.gradle.kts" | head -n 1 | xargs dirname)
        echo "La carpeta del proyecto es: $PROJECT_DIR"
        
        # 2. Entrar a la carpeta
        cd "$PROJECT_DIR"
        
        # 3. Compilar usando el comando 'gradle' del sistema (no ./gradlew)
        gradle assembleDebug
        
        # 4. Copiar el APK generado a la raíz para descargarlo fácil
        cp app/build/outputs/apk/debug/app-debug.apk ../../app-debug.apk

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: AtticPad-APK
        path: app-debug.apk
