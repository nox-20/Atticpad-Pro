name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Descomprimir el proyecto
      run: unzip -o AtticPad_Pro_Edition_UI_UX.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar CMake 3.31.6 en el SDK de Android
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.31.6" > /dev/null || true

    - name: Compilar APK
      run: |
        # Buscar la carpeta del proyecto
        PROJECT_DIR=$(find . -name "build.gradle.kts" | head -n 1 | xargs dirname)
        cd "$PROJECT_DIR"
        
        # Forzar CMake y compilar
        echo "cmake.dir=$ANDROID_HOME/cmake/3.31.6" >> local.properties
        gradle assembleDebug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: AtticPad-APK
        # Esta línea busca el .apk en cualquier carpeta del proyecto automáticamente
        path: "**/build/outputs/apk/debug/*.apk"
